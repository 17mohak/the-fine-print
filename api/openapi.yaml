openapi: 3.1.0
info:
  title: THE FINE PRINT platform API
  version: 0.0.0-p0
  summary: OpenAPI skeleton (Track P, P0). No business operations are defined or authorised yet.
  description: |
    Skeleton only, per IMPLEMENTATION_ROADMAP P0 and D-21. It fixes the cross-cutting conventions from
    SYSTEM_DESIGN section 12 and OPUS_BUILD_HANDOVER section 11 so later phases add operations consistently:

    - All operations live under `/api/v1`.
    - Errors are RFC 9457 problem details (`application/problem+json`, which supersedes RFC 7807) carrying a
      `traceId`. Error bodies never contain document content.
    - List endpoints use cursor pagination (`cursor`, `limit`).
    - Mutating endpoints accept an `Idempotency-Key` header.
    - Object bytes are streamed through the API; no storage URLs are ever returned.

    Resource groups planned in later phases (not defined here): documents, agreements, understand, provenance,
    commitments, cases, knowledge, account. `/algo/*` endpoints never belong to this API (they exist only in the
    separate cia-demo application, which is not authorised).
servers:
  - url: /api/v1
    description: Same-origin, versioned base path
paths: {}
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Must never include document text or other user content.
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable, content-free explanation.
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          description: Correlation id for support; carries no user data.
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page, or null when there is none.
        hasMore:
          type: boolean
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned by a previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key that makes a mutating request safe to retry.
      schema:
        type: string
        maxLength: 128
  responses:
    Problem:
      description: Error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
